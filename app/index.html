<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI trophy checklist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>GTA VI trophy checklist</h1>
  <p id="progress">0 of 55 earned</p>
</header>
<div class="controls">
  <label>Grade <select id="grade"><option value="all">All</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select></label>
  <button id="export" type="button">Export progress</button>
  <label class="import">Import progress <input id="import" type="file" accept="application/json"></label>
</div>
<table>
  <thead><tr><th>Earned</th><th>Trophy</th><th>Grade</th><th>How to get it</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script type="module" src="app.js"></script>
</body>
</html>
